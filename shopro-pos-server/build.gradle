plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // BCrypt password hashing (standalone, no security filter chain)
    implementation 'org.springframework.security:spring-security-crypto'
    
    // WebSockets for Real-Time KDS Sync
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    
    // Flyway for migrations
    implementation 'org.flywaydb:flyway-core'

    // JWT for DPoP and JWS (FAPI)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // QR Code Generation
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    // Lombok & MapStruct
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    // AI 3-Way Matching Engine Dependencies
    implementation 'org.apache.pdfbox:pdfbox:2.0.30'
    implementation 'net.sourceforge.tess4j:tess4j:5.10.0'
    implementation 'org.openpnp:opencv:4.9.0-0'
    implementation 'org.jgrapht:jgrapht-core:1.5.2'
    implementation 'org.apache.commons:commons-text:1.11.0'
    implementation 'com.itextpdf:itext7-core:8.0.2'
}

tasks.named('test') {
    useJUnitPlatform()
}
