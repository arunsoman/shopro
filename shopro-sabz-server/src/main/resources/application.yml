spring:
  application:
    name: shopro-pos-server
  datasource:
    url: jdbc:postgresql://localhost:5432/shopro_pos
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
server:
  port: ${PORT:8080}
  forward-headers-strategy: native

fapi:
  gateway:
    internal-secret: ${FAPI_INTERNAL_SECRET:super-secret-fapi-gateway-key-32chars}
    issuer: http://localhost:3001
    audience: sabz-web-client-api
    token-ttl-leeway-seconds: 5

logging:
  file:
    name: logs/sabz-server.log
  level:
    mls.sho.dms: DEBUG
    org.springframework.web: INFO
    org.springframework.messaging: DEBUG
    fapi-audit: INFO
