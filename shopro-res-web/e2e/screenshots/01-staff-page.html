/* ── 5. Skeleton loading shimmer ───────────────────────────── */
@keyframes shimmer {
  0% {
    background-position: -600px 0;
  }

  100% {
    background-position: 600px 0;
  }
}
.skeleton-shimmer {
  background: linear-gradient(90deg,
      var(--border-soft) 0%,
      var(--surface-3) 40%,
      var(--border-soft) 80%);
  background-size: 1200px 100%;
  animation: shimmer 1.6s ease-in-out infinite;
  border-radius: 0.5rem;
}
/* ── 6. Glow effects for key brand moments ─────────────────── */
@keyframes pulse-glow {

  0%,
  100% {
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 0%, transparent);
  }

  50% {
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--primary) 20%, transparent);
  }
}
.glow-pulse {
  animation: pulse-glow 2.4s ease-in-out infinite;
}
/* Teal glow on hover (for icon buttons, active indicators, etc.) */
.glow-hover {
  transition: box-shadow 0.25s ease;
}
.glow-hover:hover {
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 22%, transparent);
}
/* ── 7. Theme transition — smooth swap ─────────────────────── */
*,
*::before,
*::after {
  transition:
    background-color 0.3s ease,
    border-color 0.3s ease,
    color 0.2s ease,
    box-shadow 0.2s ease;
}
/* Opt-out for elements where transitions would cause jank */
img,
svg,
canvas,
video,
[data-no-transition] {
  transition: none !important;
}
